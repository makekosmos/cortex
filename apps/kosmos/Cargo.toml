[package]
name = "kosmos"
version = "0.1.0"
edition = "2021"
description = "Kepler Kosmos — единый ARK host (фоновый процесс с трей-иконкой) + global launcher"

[[bin]]
name = "kosmos"
path = "src/main.rs"

[dependencies]
# Phase 0 (Electron pivot): backend модули вынесены в services/kosmos-backend/.
# Этот крейт остаётся как desktop binary с tray + launcher; backend re-export'ится
# через apps/kosmos/src/lib.rs.
kosmos-backend = { path = "../../services/kosmos-backend" }
ark-core = { path = "../../packages/ark-core/rust" }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "time",
  "sync",
  "io-util",
  "io-std",
  "process",
  "signal",
] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
chrono = "0.4"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
# Phase 1.6: tray-icon + tao для event loop (cross-platform tray UI).
tray-icon = "0.20"
tao = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
# Phase 6: global Alt+Space hotkey + launcher window.
# `eframe` (egui all-in-one) — практичный выбор vs gpui git-deps (10-15min first build).
global-hotkey = "0.7"
eframe = { version = "0.31", default-features = false, features = [
  "default_fonts",
  "glow",
] }
egui = "0.31"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
criterion = "0.5"

[[bench]]
name = "rpc_latency"
harness = false
