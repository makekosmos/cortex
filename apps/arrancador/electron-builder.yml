appId: com.arrancador.app
productName: Arrancador
directories:
  output: release
files:
  - out/**
  - package.json
asar: true
npmRebuild: false
win:
  executableName: arrancador
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
