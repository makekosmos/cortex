appId: com.arrancador.app
productName: Arrancador
directories:
  output: release
files:
  - out/**
  - package.json
asar: true
extraResources:
  - from: sidecar/target/release/arrancador-sidecar.exe
    to: arrancador-sidecar/arrancador-sidecar.exe
  - from: ../../packages/ark-core/rust/target/release/ark-core-rpc.exe
    to: ark-core/ark-core-rpc.exe
npmRebuild: false
win:
  executableName: arrancador
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
