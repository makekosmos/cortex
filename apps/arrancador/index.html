<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arrancador</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at top, rgba(245, 158, 11, 0.12), transparent 36%),
          linear-gradient(180deg, #101724 0%, #0f131a 100%);
      }

      body {
        font-family:
          "Segoe UI",
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }

      #root {
        min-height: 100vh;
      }

      .arrancador-startup-screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(245, 158, 11, 0.14), transparent 38%),
          linear-gradient(180deg, #101724 0%, #0f131a 100%);
        color: rgba(241, 245, 249, 0.92);
      }

      .arrancador-startup-card {
        display: flex;
        min-width: 240px;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 22px;
        padding: 22px 24px;
        background: rgba(15, 19, 26, 0.72);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.32);
        backdrop-filter: blur(14px);
      }

      .arrancador-startup-spinner {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        border: 2px solid rgba(255, 255, 255, 0.18);
        border-top-color: #f59e0b;
        animation: arrancador-spin 0.9s linear infinite;
      }

      .arrancador-startup-title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .arrancador-startup-copy {
        font-size: 12px;
        color: rgba(226, 232, 240, 0.68);
      }

      @keyframes arrancador-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="arrancador-startup-screen" class="arrancador-startup-screen">
      <div class="arrancador-startup-card">
        <div class="arrancador-startup-spinner" aria-hidden="true"></div>
        <div class="arrancador-startup-title">Arrancador</div>
        <div class="arrancador-startup-copy">Загружаю интерфейс…</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src-vue/main.ts"></script>
  </body>
</html>
