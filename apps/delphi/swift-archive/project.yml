name: Delphi
options:
  bundleIdPrefix: com.kazui
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.30"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Delphi:
    type: application
    platform: macOS
    sources:
      - path: Delphi
        excludes:
          - "**/*.xcassets"
    resources:
      - path: Delphi/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kazui.delphi
        INFOPLIST_FILE: Delphi/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Delphi/Resources/Delphi.entitlements
        PRODUCT_NAME: Delphi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: Delphi/Resources/Info.plist
      properties:
        CFBundleName: Delphi
        CFBundleDisplayName: Delphi
        CFBundleIdentifier: com.kazui.delphi
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: Delphi
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.productivity
    entitlements:
      path: Delphi/Resources/Delphi.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
