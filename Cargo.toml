[workspace]
resolver = "2"
members = [
  "runtime",
  "runtime/crates/package-protocol",
  "runtime/crates/pe-version-info",
  "runtime/crates/engine-base",
  "runtime/crates/engine-dictation",
  "runtime/crates/engine-packages",
  "core/crates/ark-core",
]
# Pinned sibling component checkouts cloned under desktop/.tmp (local builds)
# are standalone crates, never workspace members.
exclude = ["desktop/.tmp"]

# Local builds: full debuginfo made link.exe write ~20 GB of PDBs and dominated
# rebuild time. Line tables keep panic backtraces with file:line; dependencies
# rarely need stepping. Measured in docs/experiments/2026-09-30-build-speed.md.
# Release builds are unaffected.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# No [profile.test] override: the test profile inherits dev. A different
# debuginfo setting here made the gate compile the engine rlib twice per run —
# once in dev for the fixture bins, once in test for nextest (KOS-291).

[workspace.package]
edition = "2021"

[workspace.lints.clippy]
unwrap_used = "deny"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "deny"

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
rand = "0.8"
sha2 = "0.10"
semver = "1"
futures-util = "0.3"
tokio-tungstenite = "0.24"
tempfile = "3"
hostname = "0.4"
