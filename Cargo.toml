[workspace]
resolver = "2"
members = [
  "runtime",
  "runtime/crates/package-protocol",
  "native-services/watcher",
  "native-services/focus-helper",
  "native-services/focus-svc",
  "core/crates/ark-core",
]
# Pinned sibling component checkouts cloned under desktop/.tmp (local builds)
# are standalone crates, never workspace members.
exclude = ["desktop/.tmp"]

[profile.test]
debug = 0

[workspace.package]
edition = "2021"

[workspace.lints.clippy]
unwrap_used = "deny"
panic = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
rand = "0.8"
sha2 = "0.10"
semver = "1"
futures-util = "0.3"
tokio-tungstenite = "0.24"
tempfile = "3"
hostname = "0.4"
