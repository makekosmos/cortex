[workspace]
resolver = "2"
members = [
  "runtime",
  "runtime/crates/package-protocol",
  "runtime/crates/pe-version-info",
  "runtime/crates/engine-base",
  "runtime/crates/engine-dictation",
  "runtime/crates/engine-packages",
  "runtime/crates/engine-indexes",
  "core/crates/ark-core",
]
# Pinned sibling component checkouts cloned under desktop/.tmp (local builds)
# are standalone crates, never workspace members.
exclude = ["desktop/.tmp"]

# Local builds: full debuginfo made link.exe write ~20 GB of PDBs and dominated
# rebuild time. Line tables keep panic backtraces with file:line; dependencies
# rarely need stepping. Measured in docs/experiments/2026-09-30-build-speed.md.
# Release builds are unaffected.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# No [profile.test] override: the test profile inherits dev. A different
# debuginfo setting here made the gate compile the engine rlib twice per run —
# once in dev for the fixture bins, once in test for nextest (KOS-291).

[workspace.package]
edition = "2021"

[workspace.lints.clippy]
unwrap_used = "deny"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "deny"

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
rand = "0.8"
sha2 = "0.10"
semver = "1"
futures-util = "0.3"
tokio-tungstenite = "0.30"
tempfile = "3"
hostname = "0.4"
hpke = { version = "=0.14.1", default-features = false, features = [
  "alloc",
  "getrandom",
  "x25519",
  "hkdfsha2",
  "chacha",
] }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls-no-provider",
  "multipart",
  "socks",
] }
# One TLS backend for the whole tree: iroh/noq and the DNS resolver already run
# on ring, so reqwest uses it too (no aws-lc C build). reqwest's
# `rustls-no-provider` requires the provider to be installed before the first
# client, which engine_base::http does.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.22"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
# Unix release assets are `.tar.gz` (zip handles the Windows ones).
flate2 = { version = "1", default-features = false }
tar = "0.4"
tracing = "0.1"
async-trait = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
lnk = "0.5"
regex = "1"
libc = "0.2"
same-file = "1"
httpmock = "0.8.3"
ed25519-dalek = "=3.0.0-rc.0"
