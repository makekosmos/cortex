[workspace]
resolver = "2"
members = [
    "crates/ark-core/rust",
    "services/kepler-backend",
    "services/ark-relay-server",
    "services/kepler-watcher",
]
# Замороженный код. Не build'ится по умолчанию; реактивация требует
# proof-loop (см. legacy/README.md).
# Eden Heart (apps/eden/ts/heart) — standalone Rust crate с собственной
# конфигурацией (edition 2024 + опции профиля). Не входит в workspace,
# собирается через cargo build --manifest-path apps/eden/ts/heart/Cargo.toml.
exclude = [
    "legacy/usage-tracker",
    "apps/eden/ts/heart",
]

[workspace.package]
edition = "2021"

# Common dependencies pinned at workspace level. Per-crate Cargo.toml
# consume them via `{ workspace = true }`. Deps with crate-specific
# feature variation (notably `tokio`, `windows`) stay per-crate.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
rand = "0.8"
hostname = "0.4"
sha2 = "0.10"
futures-util = "0.3"
tokio-tungstenite = "0.24"
tempfile = "3"
