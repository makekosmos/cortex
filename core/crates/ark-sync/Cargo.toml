[package]
name = "ark-sync"
version = "0.1.0"
edition.workspace = true
description = "Transport-neutral replication protocol and direct-session runtime"

[features]
test-support = []

[dependencies]
ark-application = { path = "../ark-application" }
ark-domain = { path = "../ark-domain" }
ark-sync-contracts = { path = "../ark-sync-contracts" }
async-trait.workspace = true
chrono.workspace = true
rand.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
ark-store = { path = "../ark-store" }
ed25519-dalek.workspace = true
rusqlite.workspace = true
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
