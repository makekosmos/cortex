[package]
name = "kernel"
version = "0.1.0"
edition.workspace = true
description = "Unified DB + sync engine for Mundus"
# No binaries ship from this crate; keep Cargo from auto-discovering any
# src/bin leftovers so test-target counts stay explicit.
autobins = false

[lib]
name = "kernel"
path = "src/lib.rs"
# No doc-tests in the workspace; disabling them removes an empty
# `cargo test --doc` pass from the gate (KOS-291).
doctest = false


[dependencies]
domain = { path = "../domain" }
sync = { path = "../sync" }
net = { path = "../net", default-features = false }
store = { path = "../store" }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "time",
  "sync",
  "io-util",
  "io-std",
  "signal",
] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
futures-util.workspace = true
ed25519-dalek.workspace = true
chrono.workspace = true
async-trait.workspace = true
thiserror.workspace = true

# DB backup runs на отдельном потоке с пониженным CPU+I/O приоритетом
# (THREAD_MODE_BACKGROUND_BEGIN), чтобы тяжёлое копирование не насыщало диск.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_System_Threading",
  # KOS-51: FILE_FLAG_OPEN_REPARSE_POINT для no-follow open snapshot-файлов.
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
store = { path = "../store", features = ["test-support"] }
sync = { path = "../sync", features = ["test-support"] }
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-tungstenite.workspace = true
tempfile.workspace = true

[features]
default = ["desktop-net"]
# Forward desktop networking features to net; engine-mobile opts out.
desktop-net = ["net/desktop-net"]

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true
