[package]
name = "ark-store"
version = "0.1.0"
edition.workspace = true
description = "SQLite adapters for ARK persistence contracts"

[features]
default = []
test-support = []

[dependencies]
ark-application = { path = "../ark-application" }
ark-domain = { path = "../ark-domain" }
chrono.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
sha2.workspace = true
rand.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
