[package]
name = "ark-core"
version = "0.1.0"
edition.workspace = true
description = "Unified DB + sync engine for Mundus/Delphi"
# No binaries ship from this crate; keep Cargo from auto-discovering any
# src/bin leftovers so test-target counts stay explicit.
autobins = false

[lib]
name = "ark_core"
path = "src/lib.rs"
# No doc-tests in the workspace; disabling them removes an empty
# `cargo test --doc` pass from the gate (KOS-291).
doctest = false


[dependencies]
ark-application = { path = "../ark-application" }
ark-domain = { path = "../ark-domain" }
ark-sync = { path = "../ark-sync" }
ark-net = { path = "../ark-net" }
ark-store = { path = "../ark-store" }
rusqlite.workspace = true
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "time",
  "sync",
  "io-util",
  "io-std",
  "signal",
] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
semver.workspace = true
chrono.workspace = true
rand.workspace = true
async-trait.workspace = true
thiserror.workspace = true
# iroh p2p QUIC-транспорт — штатный транспорт start_sync (`use_iroh`), не
# опциональный: release Engine собирается с ним, поэтому гейт тоже (KOS-270 —
# gate tests exactly what ships). default-features = off + desktop-net:
# UPnP/NAT-PMP port mapping (igd-next, h2, xml — ~670 KB) and iroh metrics
# stay on desktop; engine-mobile builds with default-features = false so
# the Android cdylib keeps only holepunching + relay over ring TLS.
iroh = { version = "1.0.0", default-features = false, features = ["tls-ring"] }
# Structured logging facade — host process (the Engine) installs the
# subscriber; without one the calls are no-ops. Used for relay connectivity
# transitions so the log keeps one warn per up/down flap (KOS-298).
tracing.workspace = true
# Ticket-based pairing (NodeTicket/EndpointTicket) — отдельный крейт,
# `iroh` 1.0.0 их не реэкспортирует (проверено: нет `Ticket` в src/lib.rs).
iroh-tickets = "1.0.0"

# DB backup runs на отдельном потоке с пониженным CPU+I/O приоритетом
# (THREAD_MODE_BACKGROUND_BEGIN), чтобы тяжёлое копирование не насыщало диск.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_System_Threading",
  # KOS-51: FILE_FLAG_OPEN_REPARSE_POINT для no-follow open snapshot-файлов.
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tempfile.workspace = true
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.5"

[features]
default = ["desktop-net"]
# iroh features that desktop Engine ships and mobile drops (see the iroh
# dep note above). Kept a default so every host crate gets what release
# Engine tests; only engine-mobile opts out.
desktop-net = ["iroh/portmapper", "iroh/metrics", "iroh/fast-apple-datapath"]
bench-fixtures = []

[[bench]]
name = "delphi_filters"
harness = false
required-features = ["bench-fixtures"]

[lints]
workspace = true
