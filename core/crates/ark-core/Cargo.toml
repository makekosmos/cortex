[package]
name = "ark-core"
version = "0.1.0"
edition.workspace = true
description = "Unified DB + sync engine for Mundus/Delphi"
# No binaries ship from this crate; keep Cargo from auto-discovering any
# src/bin leftovers so test-target counts stay explicit.
autobins = false

[lib]
name = "ark_core"
path = "src/lib.rs"
# No doc-tests in the workspace; disabling them removes an empty
# `cargo test --doc` pass from the gate (KOS-291).
doctest = false


[dependencies]
rusqlite.workspace = true
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "time",
  "sync",
  "io-util",
  "io-std",
  "signal",
] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ed25519-dalek = "=3.0.0-rc.0"
semver.workspace = true
chrono.workspace = true
rand.workspace = true
async-trait = "0.1"
if-addrs = "0.13"
hostname.workspace = true
thiserror.workspace = true
# iroh p2p QUIC-транспорт — штатный транспорт start_sync (`use_iroh`), не
# опциональный: release Engine собирается с ним, поэтому гейт тоже (KOS-270 —
# gate tests exactly what ships).
iroh = "1.0.0"
# Structured logging facade — host process (the Engine) installs the
# subscriber; without one the calls are no-ops. Used for relay connectivity
# transitions so the log keeps one warn per up/down flap (KOS-298).
tracing = "0.1"
# Ticket-based pairing (NodeTicket/EndpointTicket) — отдельный крейт,
# `iroh` 1.0.0 их не реэкспортирует (проверено: нет `Ticket` в src/lib.rs).
iroh-tickets = "1.0.0"

# DB backup runs на отдельном потоке с пониженным CPU+I/O приоритетом
# (THREAD_MODE_BACKGROUND_BEGIN), чтобы тяжёлое копирование не насыщало диск.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_System_Threading",
  # KOS-51: FILE_FLAG_OPEN_REPARSE_POINT для no-follow open snapshot-файлов.
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tempfile.workspace = true
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.5"

[features]
bench-fixtures = []

[[bench]]
name = "delphi_filters"
harness = false
required-features = ["bench-fixtures"]

[lints]
workspace = true
