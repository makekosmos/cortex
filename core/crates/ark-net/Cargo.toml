[package]
name = "ark-net"
version = "0.1.0"
edition.workspace = true
description = "Networking transports and host discovery for ARK"

[dependencies]
ark-domain = { path = "../ark-domain" }
ark-net-policy = { path = "../ark-net-policy" }
ark-sync-contracts = { path = "../ark-sync-contracts" }
async-trait.workspace = true
futures-util.workspace = true
if-addrs = "0.13"
hostname.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
  "io-util",
] }
tokio-tungstenite.workspace = true
tracing.workspace = true
iroh = { version = "1.0.0", default-features = false, features = ["tls-ring"] }
iroh-tickets = "1.0.0"

[features]
default = ["desktop-net"]
desktop-net = ["iroh/portmapper", "iroh/metrics", "iroh/fast-apple-datapath"]

[dev-dependencies]
ed25519-dalek.workspace = true

[lints]
workspace = true
