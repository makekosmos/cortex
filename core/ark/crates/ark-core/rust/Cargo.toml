[package]
name = "ark-core"
version = "0.1.0"
edition.workspace = true
description = "Unified DB + sync engine for Kepler/Delphi"

[lib]
name = "ark_core"
path = "src/lib.rs"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "ark-core-rpc"
path = "src/main.rs"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
rusqlite.workspace = true
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "time",
  "sync",
  "io-util",
  "io-std",
] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
chrono.workspace = true
rand.workspace = true
async-trait = "0.1"
uniffi = { version = "0.28", features = ["cli"] }
if-addrs = "0.13"
hostname.workspace = true
thiserror.workspace = true
# Phase 5 bug-detection: ts-rs codegen для wire-protocol типов.
# Derive opt-in через #[cfg_attr(feature = "ts-rs", derive(TS))] — production
# build не подтягивает ts-rs runtime (он только для тестов которые экспортят
# bindings).
ts-rs = { version = "10", optional = true, features = ["import-esm"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tempfile.workspace = true
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.5"

[features]
bench-fixtures = []
# Phase 5: opt-in для cargo test --features ts-rs (генерирует bindings/*.ts).
ts-rs = ["dep:ts-rs"]

[[bench]]
name = "delphi_filters"
harness = false
required-features = ["bench-fixtures"]

[[bench]]
name = "pomodoro_session"
harness = false

[lints]
workspace = true
