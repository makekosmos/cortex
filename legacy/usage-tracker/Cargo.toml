[package]
name = "usage-tracker"
version = "0.1.0"
edition = "2021"
description = "Windows foreground usage tracker that writes directly into Ark DB (FROZEN — Phase E, см. legacy/README.md)"

# Замороженная standalone-версия (Phase E refactor 2026-05-14). Не часть
# Cargo workspace'а — поэтому версии deps inline'нуты обратно. Реактивация
# требует proof-loop. Логика теперь живёт в
# services/kepler-backend/src/usage_tracker/.

[dependencies]
ark-core = { path = "../../crates/ark-core/rust" }
chrono = "0.4"
hostname = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "macros", "time", "sync", "io-util"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
thiserror = "1"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
