[package]
name = "kepler-backend"
version = "0.1.0"
edition.workspace = true
description = "Kosmos Kepler backend — headless ARK host (WS server, sidecar supervisor, sync)"

[lib]
name = "kepler_backend"
path = "src/lib.rs"

[[bin]]
name = "kepler-backend"
path = "src/main.rs"

[dependencies]
ark-core = { path = "../../crates/ark-core/rust" }
rusqlite.workspace = true
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "time",
  "sync",
  "io-util",
  "io-std",
  "process",
  "signal",
] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
chrono.workspace = true
thiserror.workspace = true
uuid.workspace = true
# usage_tracker module (Phase E1) — sha2 для tracked_app_id хеша.
sha2.workspace = true
# Phase 7 — export module: CSV для task/time_entry конвертеров.
csv = "1"
# Arrancador RAWG client (subagent B) — HTTP в RAWG.io.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2"
async-trait = "0.1"
# Arrancador SQOBA (subagent C) — zip backup/restore save-files.
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
tokio-test = "0.4"
httpmock = "0.7"
