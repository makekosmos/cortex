[package]
name = "kepler-backend"
version = "0.1.0"
edition.workspace = true
description = "Kosmos Kepler backend — headless ARK host (WS server, sidecar supervisor, sync)"

[lib]
name = "kepler_backend"
path = "src/lib.rs"

[[bin]]
name = "kepler-backend"
path = "src/main.rs"

[dependencies]
ark-core = { path = "../../crates/ark-core/rust" }
rusqlite.workspace = true
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "time",
  "sync",
  "io-util",
  "io-std",
  "process",
  "signal",
] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
chrono.workspace = true
thiserror.workspace = true
uuid.workspace = true
# usage_tracker module (Phase E1) — sha2 для tracked_app_id хеша.
sha2.workspace = true
# Phase 7 — export module: CSV для task/time_entry конвертеров.
csv = "1"
# Arrancador RAWG client (subagent B) — HTTP в RAWG.io.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2"
async-trait = "0.1"
# Arrancador SQOBA (subagent C) — zip backup/restore save-files.
zip = { version = "0.6", default-features = false, features = ["deflate"] }
# App Index (2026-05-22): .lnk parsing для Start Menu sources.
lnk = "0.5"
# App Index: fs-watch для invalidation cache.
notify = "6"
# App Index: рекурсивный walk Start Menu directories.
walkdir = "2"
# File Index: user-mode traversal with .gitignore support + user globs.
ignore = "0.4"
globset = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
# Phase 4 bug-detection: structured logging.
# tracing = фасад; subscriber = JSON exporter + env-filter; appender =
# rolling daily file под `<data_dir>/logs/<slot>/`.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

[target.'cfg(windows)'.dependencies]
ntfs-reader = "0.4.5"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Storage_FileSystem",
  # App Index icons (2026-05-22): ExtractIconExW + GDI DIB → PNG conversion.
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
  # App Index UWP source (2026-05-22): PackageManager / AppListEntry для UWP enum.
  "Management_Deployment",
  "ApplicationModel",
  "ApplicationModel_Core",
  "Foundation",
  "Foundation_Collections",
  "Storage",
  "Storage_Streams",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
httpmock = "0.7"

[lints]
workspace = true
