[package]
name = "ark-relay-server"
version = "0.1.0"
edition.workspace = true
description = "Relay server for Kepler/Delphi P2P mesh — forwards LanSyncMessage frames between devices sharing a space_id"

[[bin]]
name = "ark-relay-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tokio-tungstenite.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
