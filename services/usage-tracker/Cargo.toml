[package]
name = "usage-tracker"
version = "0.1.0"
edition = "2021"
description = "Windows foreground usage tracker that writes directly into Ark DB"

[dependencies]
ark-core = { path = "../../packages/ark-core/rust" }
chrono = "0.4"
hostname = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
# Phase 4: WS-клиент к Kosmos host (replace direct ARK writes).
# Wiring в main.rs — opt-in через env USAGE_TRACKER_USE_COSMOS=1 (по умолчанию остаётся direct write).
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "macros", "time", "sync", "io-util"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
thiserror = "1"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

