[package]
name = "usage-tracker"
version = "0.1.0"
edition.workspace = true
description = "Windows foreground usage tracker that writes directly into Ark DB"

[dependencies]
ark-core = { path = "../../crates/ark-core/rust" }
chrono.workspace = true
hostname.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
# Phase 4: WS-клиент к Kepler host (replace direct ARK writes).
# Wiring в main.rs — opt-in через env USAGE_TRACKER_USE_KEPLER=1 (по умолчанию остаётся direct write).
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "macros", "time", "sync", "io-util"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
thiserror.workspace = true
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true
