[package]
name = "kepler-focus-svc"
version = "0.1.0"
edition.workspace = true
description = "Windows Service для focus mode hosts file management. Listens на named pipe \\\\.\\pipe\\kepler-focus-svc, принимает JSON ops от Kepler shell."

[[bin]]
name = "kepler-focus-svc"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
kepler-focus-helper = { path = "../kepler-focus-helper" }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.59", features = [
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_IO",
] }

[target.'cfg(windows)'.build-dependencies]
embed-manifest = "1.4"

[dev-dependencies]
tempfile = { workspace = true }
