[package]
name = "kepler-focus-helper"
version = "0.1.0"
edition.workspace = true
description = "Elevated helper для блокировки доменов через Windows hosts file. stdin JSON → operation → stdout JSON, exit."

[[bin]]
name = "kepler-focus-helper"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
embed-manifest = "1.4"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
