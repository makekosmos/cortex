# Pre-commit hooks — lefthook
# Install: brew install lefthook && lefthook install

pre-commit:
  parallel: true
  commands:
    delphi-ts-lint:
      glob: "apps/delphi/ts/**/*.{ts,tsx}"
      run: cd apps/delphi/ts && bun run lint
    delphi-ts-format:
      glob: "apps/delphi/ts/**/*.{ts,tsx,vue,css}"
      run: cd apps/delphi/ts && bun run format:check
    eden-ts-lint:
      glob: "apps/eden/ts/**/*.{ts,tsx}"
      run: cd apps/eden/ts && bun run lint
    eden-ts-format:
      glob: "apps/eden/ts/**/*.{ts,tsx,vue}"
      run: cd apps/eden/ts && bun run format:check
    eden-heart-fmt:
      glob: "apps/eden/ts/heart/**/*.rs"
      run: cd apps/eden/ts/heart && cargo fmt --check
    ark-core-rust:
      glob: "packages/ark-core/rust/**/*.rs"
      run: cd packages/ark-core/rust && cargo check --quiet
    typecheck-delphi:
      glob: "apps/delphi/ts/**/*.{ts,tsx}"
      run: cd apps/delphi/ts && bunx tsc --noEmit
    typecheck-eden:
      glob: "apps/eden/ts/**/*.{ts,tsx}"
      run: cd apps/eden/ts && bunx tsc --noEmit
    docs-sync:
      glob: "docs-site/**/*.md"
      run: bun run docs:sync && git add AGENTS.md CLAUDE.md apps/*/AGENTS.md apps/*/*/AGENTS.md packages/ark-core/AGENTS.md services/usage-tracker/AGENTS.md docs-site/public/llms.txt
    docs-check:
      glob: "docs-site/**/*.md"
      run: bun run docs:check

pre-push:
  parallel: true
  commands:
    test-delphi:
      glob: "apps/delphi/ts/**/*"
      run: cd apps/delphi/ts && bun run test
    test-ark-core:
      glob: "packages/ark-core/rust/**/*.rs"
      run: cd packages/ark-core/rust && cargo test --quiet
    test-eden-heart:
      glob: "apps/eden/ts/heart/**/*"
      run: cd apps/eden/ts/heart && cargo test
