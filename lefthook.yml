# Pre-commit hooks — lefthook
# Install: brew install lefthook && lefthook install

pre-commit:
  parallel: false
  commands:
    ark-core-rust:
      glob: "core/ark/crates/ark-core/rust/**/*.rs"
      run: cd core/ark/crates/ark-core/rust && cargo check --quiet
    rustfmt:
      glob: "**/*.rs"
      run: cargo fmt --check
    # Phase 5 bug-detection: ts-rs bindings up-to-date guard.
    # Если правил types.rs и забыл cargo test --features ts-rs — fail.
    ts-rs-bindings-fresh:
      glob: "core/ark/crates/ark-core/rust/src/types.rs"
      run: |
        cd core/ark/crates/ark-core/rust && \
        cargo test --features ts-rs --quiet --lib export_bindings 2>&1 > /dev/null && \
        cd - && \
        bunx oxfmt core/ark/packages/ark/src/generated/ && \
        git diff --exit-code core/ark/packages/ark/src/generated/
    oxlint:
      glob: "*.{ts,tsx,vue,mjs,cjs,js,jsx}"
      run: bunx oxlint {staged_files}
    ark-guard-writes:
      glob: "scripts/**/*.{ts,tsx,mjs,cjs,js}"
      run: bun run ark:guard:writes
    oxfmt:
      run: bunx oxfmt --check .
    source-size:
      run: bun run check:source-size

pre-push:
  parallel: false
  commands:
    test-ark-core:
      glob: "core/ark/crates/ark-core/rust/**/*.rs"
      run: cd core/ark/crates/ark-core/rust && cargo nextest run
    # Hygiene: orphan deps в Cargo workspace. Fail если найдены unused —
    # автор должен либо удалить (cargo shear --fix), либо добавить в
    # ignore-list если deps нужны для feature-flag'а / build-script'а.
    cargo-shear:
      glob: "**/Cargo.toml"
      run: cargo shear
    clippy:
      glob: "**/*.rs"
      run: cargo clippy --workspace --all-targets --quiet
