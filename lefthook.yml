# Pre-commit hooks — lefthook
# Install: brew install lefthook && lefthook install

pre-commit:
  parallel: true
  commands:
    ark-core-rust:
      glob: "crates/ark-core/rust/**/*.rs"
      run: cd crates/ark-core/rust && cargo check --quiet
    kepler-backend-rust:
      glob: "services/kepler-backend/src/**/*.rs"
      run: cd services/kepler-backend && cargo check --quiet
    typecheck-shell:
      glob: "shell/**/*.{ts,tsx,vue}"
      run: cd shell && bunx tsc --noEmit
    oxlint:
      glob: "*.{ts,tsx,vue,mjs,cjs,js,jsx}"
      run: bunx oxlint {staged_files}
    oxfmt:
      glob: "*.{ts,tsx,vue,mjs,cjs,js,jsx,json}"
      run: bunx oxfmt --check {staged_files}
    ark-guard-writes:
      glob: "{shell/electron,extensions,tests/e2e}/**/*.{ts,tsx,mjs,cjs,js}"
      run: bun run ark:guard:writes
    docs-sync:
      glob: "docs-site/**/*.md"
      run: bun run docs:sync && git add AGENTS.md CLAUDE.md mobile/*/AGENTS.md crates/ark-core/AGENTS.md docs-site/public/llms.txt docs-site/public/full-llms.txt
    docs-check:
      glob: "docs-site/**/*.md"
      run: bun run docs:check

pre-push:
  parallel: true
  commands:
    test-ark-core:
      glob: "crates/ark-core/rust/**/*.rs"
      run: cd crates/ark-core/rust && cargo nextest run --quiet
    test-kepler-backend:
      glob: "services/kepler-backend/src/**/*.rs"
      run: cd services/kepler-backend && cargo nextest run --lib --quiet
    # Hygiene: orphan deps в Cargo workspace. Fail если найдены unused —
    # автор должен либо удалить (cargo shear --fix), либо добавить в
    # ignore-list если deps нужны для feature-flag'а / build-script'а.
    cargo-shear:
      glob: "**/Cargo.toml"
      run: cargo shear
    clippy:
      glob: "**/*.rs"
      run: cargo clippy --workspace --all-targets --quiet
