[package]
name = "engine-dictation"
version = "0.1.0"
edition.workspace = true
description = "Engine dictation — Groq cloud + local STT (whisper/parakeet sidecar), hotkey capture, transcript inject"

[lib]
name = "engine_dictation"
path = "src/lib.rs"
doctest = false

[features]
default = []
# Test-only escape hatch mirroring engine-base/test-support: exposes the
# test constructor (DictationHost::new_for_test) to downstream crates'
# test builds via dev-dependency feature unification.
test-support = []
# KOS-337: local dictation backend (whisper.cpp sidecar/direct + Parakeet
# ONNX through transcribe-rs/ort). Off by default so dev/agent builds do not
# compile the ONNX stack; the full gate and release builds enable it via
# `engine/local-dictation`. Without it every local transcribe/preload entry
# returns LocalError::NotBuiltWithLocalDictation; cloud (groq) is unaffected.
local-dictation = ["dep:transcribe-rs", "dep:ort"]

[dependencies]
engine-base = { path = "../engine-base" }
# STT backends (local-dictation feature only).
transcribe-rs = { version = "0.3.11", features = ["onnx"], optional = true }
# KOS-345 → macOS fix: статическая линковка вместо load-dynamic. ort-sys
# download-binaries в build script кладёт libonnxruntime.a в бинарь —
# рантайме ничего искать не нужно (dlopen libonnxruntime.dylib на macOS
# умирал по SIGKILL через com.apple.provenance, а error-path орта
# дедлокился на OnceLock). transcribe-rs не пробрасывает эту feature,
# поэтому ort объявлен напрямую (та же версия, feature unification).
ort = { version = "2.0.0-rc.12", optional = true }
# Inject/capture.
arboard = "3"
libloading = "0.8"
# Secrets + DNS.
keyring.workspace = true
hickory-resolver = { version = "0.25", default-features = false, features = ["tokio", "https-ring", "webpki-roots"] }
# HTTP/audio plumbing.
base64.workspace = true
reqwest.workspace = true
# Model archives.
zip.workspace = true
flate2 = "1"
tar = "0.4"
# Shared workspace deps.
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true
tokio = { version = "1", features = [
  "rt",
  "macros",
  "net",
  "time",
  "sync",
  "io-util",
  "process",
] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
# macos_native watchdog SIGTERMs lingering capture helpers (libc::kill).
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  # IMMDevice::Activate (KOS-342): PROPVARIANT activation params gated here.
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Storage_FileSystem",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
] }

[dev-dependencies]
tempfile.workspace = true
httpmock.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
