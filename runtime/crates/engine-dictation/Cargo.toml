[package]
name = "engine-dictation"
version = "0.1.0"
edition.workspace = true
description = "Engine dictation — Groq cloud + local STT (whisper/parakeet sidecar), hotkey capture, transcript inject"

[lib]
name = "engine_dictation"
path = "src/lib.rs"
doctest = false

[features]
default = []
# Test-only escape hatch mirroring engine-base/test-support: exposes the
# test constructor (DictationHost::new_for_test) to downstream crates'
# test builds via dev-dependency feature unification.
test-support = []
# KOS-337: local dictation backend (whisper.cpp sidecar/direct + Parakeet
# ONNX through transcribe-rs/ort). Off by default so dev/agent builds do not
# compile the ONNX stack; the full gate and release builds enable it via
# `engine/local-dictation`. Without it every local transcribe/preload entry
# returns LocalError::NotBuiltWithLocalDictation; cloud (groq) is unaffected.
local-dictation = ["dep:transcribe-rs", "dep:ort"]

[dependencies]
engine-base = { path = "../engine-base" }
# STT backends (local-dictation feature only).
transcribe-rs = { version = "0.3.11", features = ["onnx"], optional = true }
# KOS-345: load-dynamic — ort-sys/dlopen onnxruntime.dll в рантайме вместо
# download/link в build script. transcribe-rs не пробрасывает эту feature,
# поэтому ort объявлен напрямую (та же версия, feature unification).
ort = { version = "2.0.0-rc.12", features = ["load-dynamic"], optional = true }
# Inject/capture.
arboard = "3"
libloading = "0.8"
# Secrets + DNS.
keyring = { version = "3", features = ["windows-native", "apple-native"] }
hickory-resolver = { version = "0.24", features = ["dns-over-https-rustls"] }
# HTTP/audio plumbing.
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "multipart",
  "socks",
] }
# Model archives.
zip = { version = "0.6", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
# Shared workspace deps.
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true
rand.workspace = true
tokio = { version = "1", features = [
  "rt",
  "macros",
  "net",
  "time",
  "sync",
  "io-util",
  "process",
] }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_Storage_FileSystem",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
] }

[dev-dependencies]
tempfile.workspace = true
httpmock = "0.8.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
