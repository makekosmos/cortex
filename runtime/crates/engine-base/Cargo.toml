[package]
name = "engine-base"
version = "0.1.0"
edition.workspace = true
description = "Engine base — brand, data_dir, file hashing, process tree, lock file, handle-relative FS, package manifest, auth, engine dispatch API"

[features]
default = []
# Mirrors the engine feature: serde impls for handle_relative_fs types.
handle-relative-fs-serde = []
# Test-only escape hatch mirroring the engine feature of the same name.
package-worker-fixture = []
# Exposes #[cfg(test)]-style helpers (e.g. observability::app_rpc::tests) to
# downstream crates' test builds via dev-dependency feature unification.
test-support = []

[lib]
name = "engine_base"
path = "src/lib.rs"
doctest = false

[dependencies]
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
semver.workspace = true
sha2.workspace = true
chrono.workspace = true
uuid.workspace = true
rand.workspace = true
regex.workspace = true
url = "2"
tokio = { version = "1", features = ["process", "time", "io-util", "rt", "macros"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["fmt"] }
http = "1"
reqwest.workspace = true
rustls.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# File identity by volume serial + file index (KOS-269 round 4).
same-file.workspace = true
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
