[package]
name = "engine-mobile"
version = "0.1.0"
edition.workspace = true
description = "In-process Engine for Android — UniFFI API over kernel (no HTTP, no lockfile)"

[features]
default = []
# Builds the `uniffi-bindgen` bin used to emit Kotlin bindings
# (`cargo run -p engine-mobile --features cli --bin uniffi-bindgen`).
cli = ["uniffi/cli"]

[lib]
name = "engine_mobile"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[dependencies]
# default-features = false drops kernel/desktop-net (iroh portmapper +
# metrics) — APK size, see the desktop-net feature in net/Cargo.toml.
kernel = { path = "../../../core/crates/kernel", package = "kernel", default-features = false }
uniffi = "0.29"
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
