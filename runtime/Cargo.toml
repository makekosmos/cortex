[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
description = "Mundus Engine — headless ARK host (WS server, sidecar supervisor, sync)"
autobins = false
# `cargo run -p engine` starts the Engine; the other bins are test fixtures.
default-run = "mundus-engine"

[features]
default = ["handle-relative-fs-serde"]
handle-relative-fs-serde = ["engine-base/handle-relative-fs-serde"]
windows-gui-subsystem = []
# Test-only: relaxes the broker's HTTPS-only origin check to allow loopback
# http origins and exposes worker failure hooks. A release build refuses to
# compile with it (see the compile_error in src/lib.rs).
package-worker-fixture = [
  "engine-base/package-worker-fixture",
  "engine-packages/package-worker-fixture",
]
# Test-only feature: builds the ark-markdown-bridge integration-test
# fixture bin. Plain `cargo build`/`cargo test --lib` skip it.
markdown-bridge-fixture = []
# KOS-337: local dictation backend (whisper.cpp + Parakeet ONNX via
# transcribe-rs/ort). Off by default — dev/agent builds skip the ONNX stack;
# the full gate (test-lib GATE_FEATURES) and release builds enable it.
local-dictation = ["engine-dictation/local-dictation"]

[lib]
name = "engine"
path = "src/lib.rs"
# No doc-tests in the workspace; disabling them removes an empty
# `cargo test --doc` pass from the gate (KOS-291).
doctest = false

[[bin]]
name = "mundus-engine"
path = "src/main.rs"

[[bin]]
name = "package-worker-fixture"
path = "src/bin/package-worker-fixture.rs"
required-features = ["package-worker-fixture"]

[[bin]]
name = "ark-markdown-bridge"
path = "src/bin/ark-markdown-bridge.rs"
required-features = ["markdown-bridge-fixture"]

[dependencies]
ark-core = { path = "../core/crates/ark-core", package = "ark-core" }
package-protocol = { path = "crates/package-protocol" }
engine-base = { path = "crates/engine-base" }
engine-dictation = { path = "crates/engine-dictation" }
engine-packages = { path = "crates/engine-packages" }
engine-indexes = { path = "crates/engine-indexes" }
rusqlite.workspace = true
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "time",
  "sync",
  "io-util",
  "io-std",
  "fs",
  "process",
  "signal",
] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
regex = "1"
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
chrono.workspace = true
thiserror.workspace = true
uuid.workspace = true
# usage_tracker module (Phase E1) — sha2 для tracked_app_id хеша.
sha2.workspace = true
hmac = "0.12"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
  "multipart",
  "socks",
] }
async-trait = "0.1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Dictation deps (arboard, transcribe-rs/ort, hickory-resolver, libloading,
# enigo notes) moved with the code to runtime/crates/engine-dictation (KOS-334).
# keyring stays: package_service/integrations/secret_store.rs also uses it —
#   без backend-feature для платформы keyring молча использует mock store —
#   запись «успешна», но ключ не персистит.
# base64 — encode/decode WAV bytes между renderer и backend (shared).
keyring = { version = "3", features = ["windows-native", "apple-native"] }
base64 = "0.22"
semver = "1"
# Phase 4 bug-detection: structured logging.
# tracing = фасад; subscriber = JSON exporter + env-filter; appender =
# rolling daily file под `<data_dir>/logs/<slot>/`.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

[target.'cfg(windows)'.dependencies]
# File identity by volume serial + file index — the /v1/rpc Manager check
# must not rely on path spelling (KOS-269 round 4).
same-file = "1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Com",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_LibraryLoader",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Registry",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  # Index-only features (UWP/GDI/Firewall/Pipes/Media) moved to
  # engine-indexes and engine-dictation (KOS-334/335).
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
# Shared with manager-gpui/build.rs — one resource script for every shipped exe.
pe-version-info = { path = "crates/pe-version-info" }

[dev-dependencies]
# engine-base/engine-dictation test-support exposes shared test helpers
# (CaptureBuf, DictationHost::new_for_test) to the engine test targets;
# dev-dep features do not leak into normal builds.
engine-base = { path = "crates/engine-base", features = ["test-support"] }
engine-dictation = { path = "crates/engine-dictation", features = ["test-support"] }
engine-packages = { path = "crates/engine-packages", features = ["test-support"] }
tempfile.workspace = true
httpmock = "0.8.3"
# Test-only: the replication fixtures sign their own documents; the package
# catalog path carries no Ed25519 code. Pinned to the same release as
# ark-core so tests do not pull a second ed25519/curve25519 stack.
ed25519-dalek = "=3.0.0-rc.0"

[lints]
workspace = true
