[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
description = "Mundus Engine — headless ARK host (WS server, sidecar supervisor, sync)"
autobins = false

[features]
default = ["handle-relative-fs-serde"]
handle-relative-fs-serde = []
windows-gui-subsystem = []
# Test-only: relaxes the broker's HTTPS-only origin check to allow loopback
# http origins and exposes worker failure hooks. A release build refuses to
# compile with it (see the compile_error in src/lib.rs).
package-worker-fixture = []
# Test-only feature: builds the ark-markdown-bridge integration-test
# fixture bin. Plain `cargo build`/`cargo test --lib` skip it.
markdown-bridge-fixture = []

[lib]
name = "engine"
path = "src/lib.rs"
# No doc-tests in the workspace; disabling them removes an empty
# `cargo test --doc` pass from the gate (KOS-291).
doctest = false

[[bin]]
name = "mundus-engine"
path = "src/main.rs"

[[bin]]
name = "package-worker-fixture"
path = "src/bin/package-worker-fixture.rs"
required-features = ["package-worker-fixture"]

[[bin]]
name = "ark-markdown-bridge"
path = "src/bin/ark-markdown-bridge.rs"
required-features = ["markdown-bridge-fixture"]

[dependencies]
ark-core = { path = "../core/crates/ark-core", package = "ark-core" }
package-protocol = { path = "crates/package-protocol" }
rusqlite.workspace = true
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "time",
  "sync",
  "io-util",
  "io-std",
  "fs",
  "process",
  "signal",
] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
regex = "1"
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
chrono.workspace = true
thiserror.workspace = true
uuid.workspace = true
# usage_tracker module (Phase E1) — sha2 для tracked_app_id хеша.
sha2.workspace = true
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "multipart",
  "socks",
] }
async-trait = "0.1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
transcribe-rs = { version = "0.3.11", features = ["onnx"] }
# App Index (2026-05-22): .lnk parsing для Start Menu sources.
lnk = "0.5"
# App Index: fs-watch для invalidation cache.
notify = "6"
# App Index: рекурсивный walk Start Menu directories.
walkdir = "2"
# File Index: user-mode traversal with .gitignore support + user globs.
ignore = "0.4"
globset = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Dictation Phase 1 (2026-05-24): диктация Groq cloud.
# enigo — кросс-платформенная симуляция клавиш (Win32 SendInput) для Ctrl+V инжекта.
# arboard — clipboard read/write с восстановлением оригинала после inject.
# keyring — нативный secret store для API key (enterprise-standard, не plaintext):
#   Windows Credential Manager (windows-native) + macOS Keychain (apple-native).
#   Без backend-feature для платформы keyring молча использует mock store —
#   запись «успешна», но ключ не персистит (на macOS → submit_audio: API key не задан).
# hickory-resolver — DoH resolver для AI HTTP клиентов (РФ обход DNS poisoning).
# base64 — encode/decode WAV bytes между renderer и backend.
# arboard — save/restore clipboard поверх inject'а транскрипта. Ctrl+V сам шлётся
# через нативный windows::Win32 SendInput (enigo шёл через VK_PACKET, ломался).
arboard = "3"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
hickory-resolver = { version = "0.24", features = ["dns-over-https-rustls"] }
base64 = "0.22"
hpke = { version = "=0.14.1", default-features = false, features = [
  "alloc",
  "getrandom",
  "x25519",
  "hkdfsha2",
  "chacha",
] }
libloading = "0.8"
semver = "1"
# Phase 4 bug-detection: structured logging.
# tracing = фасад; subscriber = JSON exporter + env-filter; appender =
# rolling daily file под `<data_dir>/logs/<slot>/`.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

[target.'cfg(windows)'.dependencies]
# File identity by volume serial + file index — the /v1/rpc Manager check
# must not rely on path spelling (KOS-269 round 4).
same-file = "1"
ntfs-reader = "0.4.5"
windows-service = "0.7"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Pipes",
  "Win32_System_JobObjects",
  "Win32_System_Com",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_LibraryLoader",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_WindowsProgramming",
  "Win32_System_Registry",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Storage_FileSystem",
  "Win32_NetworkManagement_WindowsFirewall",
  # App Index icons (2026-05-22): ExtractIconExW + GDI DIB → PNG conversion.
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
  # App Index UWP source (2026-05-22): PackageManager / AppListEntry для UWP enum.
  "Management_Deployment",
  "ApplicationModel",
  "ApplicationModel_Core",
  "Foundation",
  "Foundation_Collections",
  "Storage",
  "Storage_Streams",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
# Shared with manager-gpui/build.rs — one resource script for every shipped exe.
pe-version-info = { path = "crates/pe-version-info" }

[dev-dependencies]
tempfile.workspace = true
httpmock = "0.7"
# Test-only: the replication fixtures sign their own documents; the package
# catalog path carries no Ed25519 code.
ed25519-dalek = "2"

[lints]
workspace = true
