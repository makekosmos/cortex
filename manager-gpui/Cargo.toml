[package]
name = "manager-gpui"
version = "0.1.0"
edition = "2021"
description = "GPUI Kosmos Manager — Engine-driven shell parity with the Vue Manager (KOS-130)"
default-run = "manager-gpui"

[dependencies]
gpui = { package = "gpui-kit", version = "=0.6.2" }
gpui-component = "=0.6.2"
# Imago GPUI shared palette/chrome (KOS-132). Pinned by rev; the crate
# lives in crates/imago-gpui inside the imago repo workspace.
imago-gpui = { git = "https://github.com/makekosmos/imago.git", rev = "b9dd284e70a56a151b525626c3b2463679cb8c9a" }
# Shared GPUI surface (theme/widgets/fields/engine) extracted from this crate.
# Pinned by rev; its gpui/imago-gpui specs must stay identical to ours.
kosmos-gpui-kit = { git = "https://github.com/makekosmos/kosmos-gpui-kit", rev = "b5f9b931cc4aff7aa248c88d6719569a1bd97fce" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["v4"] }
ureq = { version = "2.12", default-features = false, features = ["json"] }
flate2 = "1.1"

# Unconditional: build.rs resolves embed_resource at compile time and gates
# actual resource embedding on CARGO_CFG_TARGET_OS, so cross-compiles from
# non-Windows hosts (cargo-xwin) still embed icon + VERSIONINFO.
[build-dependencies]
embed-resource = "=3.0.11"

# Dev builds: keep debug info but optimize — unoptimized taffy/cosmic-text/
# gpui (and our own render path) make even modest UIs run at ~20fps.
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.release]
debug = false
debug-assertions = false

# Standalone crate: the Manager GPUI shell carries heavyweight UI deps that
# the runtime workspace must not inherit (mirrors how agenda-gpui ships).
[workspace]
