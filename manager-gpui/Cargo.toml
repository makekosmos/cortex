[package]
name = "manager-gpui"
version = "0.1.0"
edition = "2021"
description = "GPUI Mundus Manager — Engine-driven shell parity with the Vue Manager (KOS-130)"
default-run = "manager-gpui"

[dependencies]
gpui = { package = "gpui-kit", version = "=0.7.1" }
gpui-component = "=0.7.1"
gpui-base = "=0.7.1"
# Imago GPUI shared palette/chrome (KOS-132). Pinned by rev; the crate
# lives in crates/imago-gpui inside the imago repo workspace.
imago-gpui = { git = "https://github.com/makekosmos/imago.git", rev = "86c830675480e96b3ec21b500059410ad4c0b852" }
# Shared GPUI surface (theme/widgets/fields/engine) extracted from this
# crate. Since KOS-319 it lives at crates/mundus-gpui-kit inside imago —
# pin the SAME imago rev as imago-gpui so the lockfile holds one source.
mundus-gpui-kit = { git = "https://github.com/makekosmos/imago.git", rev = "86c830675480e96b3ec21b500059410ad4c0b852" }
serde = { version = "1.0.229", features = ["derive"] }
# KOS-355 liquid-metal logo: the mark is a checked-in lossless animated
# WebP (assets/logo-256-60.webp) decoded once into a RenderImage ring.
# `static` forces the vendored libwebp build instead of pkg-config.
webp-animation = { version = "0.10.0", features = ["static"] }
image = "0.25.1"
smallvec = "1.13"
serde_json = "1.0.151"
tracing = "0.1.44"
ureq = { version = "2.12", default-features = false, features = ["json"] }
flate2 = "1.1"

# Unconditional: build.rs resolves embed_resource (through pe-version-info)
# at compile time and the helper gates actual resource embedding on
# CARGO_CFG_TARGET_OS, so cross-compiles from non-Windows hosts (cargo-xwin)
# still embed icon + VERSIONINFO. The helper lives in the cortex workspace
# so both shipped exes share one resource script (KOS-306).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSHapticFeedback"] }

[build-dependencies]
pe-version-info = { path = "../runtime/crates/pe-version-info" }

# Dev builds: own code compiles fast (opt-level 1, line-table debuginfo);
# dependencies stay fully optimized without debuginfo — unoptimized
# taffy/cosmic-text/gpui makes even modest UIs run at ~20fps (KOS-328).
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false

[profile.release]
debug = false
debug-assertions = false

# Measurement build: release-optimized, but with debug assertions enabled
# ONLY for this crate so debug hooks like MUNDUS_DEBUG_UPDATE_OVERLAY stay
# reachable. Deps keep assertions off — enabling them globally breaks
# gpui-component's debug-only inspector code against gpui-pre.
[profile.meas]
inherits = "release"

[profile.meas.package.manager-gpui]
debug-assertions = true

# gpui-pre 0.3.8 gates `debug_selector` bounds recording on
# `all(debug_assertions, feature = "test-support")` — earlier snapshots only
# needed test-support. Deps build with debug_assertions off, so without
# this override every cx.debug_bounds() test sees None.
[profile.dev.package.gpui-pre]
debug-assertions = true

[profile.dev.package.gpui-pre-macros]
debug-assertions = true

# a11y-tree tests (KOS-142): #[gpui::test] + TestAppContext/VisualTestContext
# live behind gpui's test-support feature (deterministic executors, test
# platform). It merges only into test builds.
[dev-dependencies]
gpui = { package = "gpui-kit", version = "=0.7.1", features = ["test-support"] }

[patch.crates-io]
# One patched gpui revision shared by all three GPUI apps (KOS-328):
# gpui-pre 0.3.8 in imago carries the a11y TestWindow patch that makes
# `Window::debug_a11y_tree_json` work in #[gpui::test] runs, plus the
# agenda window fixes. See crates/gpui-pre/PATCH.md in that rev.
# gpui-pre-windows carries the Windows backend fixes (WM_NCHITTEST
# hit-testing, mouse-leave, move-loop, Mica, frame pacing); see
# crates/gpui-pre-windows/PATCH.md in that rev.
# Pinned to the same imago rev as imago-gpui/mundus-gpui-kit above.
gpui-pre = { git = "https://github.com/makekosmos/imago.git", rev = "86c830675480e96b3ec21b500059410ad4c0b852" }
gpui-pre-windows = { git = "https://github.com/makekosmos/imago.git", rev = "86c830675480e96b3ec21b500059410ad4c0b852" }

# Standalone crate: the Manager GPUI shell carries heavyweight UI deps that
# the runtime workspace must not inherit (mirrors how agenda-gpui ships).
[workspace]
