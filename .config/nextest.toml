# The Rust test gate runs through cargo-nextest (runtime/scripts/test-lib.mjs):
# every test gets its own process, so the integration binaries no longer run
# one after another and a slow test no longer holds up the rest of its binary.
nextest-version = { required = "0.9.136" }

[profile.default]
# A hung test fails after 5 minutes instead of blocking the gate forever.
slow-timeout = { period = "60s", terminate-after = 5 }

# Process-per-test makes the in-process locks around process-wide state
# (environment variables, worker failure hooks) unnecessary, but not the one
# around the OS keyring: these tests create and delete host identities under
# fixed node ids in the user's keyring, which every test process shares
# (runtime/tests/it/support/integration_replication_setup.rs, HOST_IDENTITIES).
[test-groups]
os-keyring = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary_id(engine::it) & (test(/^integration_replication_/) | test(/^support::/))'
test-group = "os-keyring"
