# PR CI — fast Ubuntu pipeline. Цель <5 минут на PR.
#
# Что НЕ делает:
#   - e2e (Windows-only, дорого; в .github/workflows/nightly.yml).
#   - vitest browser (нужен chromium; в nightly).
#   - electron-builder / release publish (отдельная задача).
#
# См. .agent/tasks/2026-05-22-bug-detection-phase3-ci/spec.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel inflight CI на новый push в тот же PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: guards (oxlint / oxfmt / ark:guard / source-size)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: oxlint
        run: bunx oxlint .
      - name: oxfmt --check
        run: bunx oxfmt --check .
      - name: ark:guard:writes
        run: bun run ark:guard:writes
      - name: generated bindings
        run: node scripts/check-ark-generated.mjs
      - name: source-size
        run: bun run check:source-size

  rust:
    name: rust (tests + clippy + dependency policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Кэш per-OS, чтобы Windows nightly не пересекался с Ubuntu PR.
          shared-key: ubuntu-stable
      - name: cargo clippy
        # Existing baseline; new warning categories still fail CI.
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -A clippy::too_many_arguments -A clippy::option_map_unit_fn -A clippy::map_flatten -A clippy::nonminimal_bool -A clippy::type_complexity -A clippy::collapsible_if -A clippy::let_and_return -A clippy::result_large_err -A clippy::duplicated_attributes -A clippy::useless_conversion -A clippy::panic -A clippy::assertions_on_constants
      - name: install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cargo nextest
        run: cargo nextest run --workspace --all-features
      - name: install cargo-shear
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-shear
      - name: cargo shear
        run: cargo shear
      - name: install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny
        run: cargo deny check advisories bans sources
