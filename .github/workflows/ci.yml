name: Shell checks

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun run check:layout
      - run: bun install --cwd host --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun run --cwd host typecheck
      - run: bun test host/electron/host-api-reconnect.test.ts
