name: Shell checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: shell-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          PLAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PLAN_HEAD: ${{ github.sha }}
        run: |
          node scripts/check-plan.mjs --mode ci --base "$PLAN_BASE" --head "$PLAN_HEAD" > plan.json
          echo "full=$(node -e "console.log(JSON.parse(require('fs').readFileSync('plan.json')).full)")" >> "$GITHUB_OUTPUT"
          echo "jobs=$(node -e "console.log(JSON.parse(require('fs').readFileSync('plan.json')).jobs.join(','))")" >> "$GITHUB_OUTPUT"

  actionlint:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

  portable:
    needs: plan
    if: needs.plan.outputs.full == 'true' || contains(needs.plan.outputs.jobs, 'portable')
    runs-on: ubuntu-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: rustc
        run: echo "version=$(printf '%s\n' \"$(rustc -Vv)\" \"$(cargo -V)\" | sha256sum | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: cargo-deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.rustc.outputs.version }}-
      # Compile output is an untrusted CI convenience cache, never a release artifact.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target
            desktop/.tmp/ark-core-rpc
          key: cargo-target-${{ runner.os }}-${{ runner.arch }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock', '.cargo/config.toml', 'desktop/scripts/ark-core-rpc.mjs') }}-debug-default+iroh-spike-workspace
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Resolve workspace pins
        id: workspace
        run: node scripts/workspace.mjs ci --github-output "$GITHUB_OUTPUT"
      - run: bun run check:layout
      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun install --cwd desktop --frozen-lockfile
      - run: bun install --cwd host --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun install --cwd manager --frozen-lockfile
      - run: bun test desktop/electron/settings-store.test.ts
      - run: bun test desktop/electron/instance.test.ts
      - run: bun test desktop/scripts/desktop-naming-contract.test.mjs
      - run: bun run check:source-size
      - run: bun run lint
      - run: bun run format:check
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Checkout shared ARK SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.workspace.outputs.arca_sdk_repository }}
          ref: ${{ steps.workspace.outputs.arca_sdk_commit }}
          path: .tmp/workspace/arca-sdk
          fetch-depth: 1
          token: ${{ secrets.KOSMOS_READ_TOKEN }}
          persist-credentials: false
      - name: Checkout shared visuals
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.workspace.outputs.imago_repository }}
          ref: ${{ steps.workspace.outputs.imago_commit }}
          path: .tmp/workspace/imago
          fetch-depth: 1
          token: ${{ secrets.KOSMOS_READ_TOKEN }}
          persist-credentials: false
      - name: Link shared workspaces
        run: |
          ln -s "$GITHUB_WORKSPACE/.tmp/workspace/arca-sdk" "$GITHUB_WORKSPACE/../arca-sdk"
          ln -s "$GITHUB_WORKSPACE/.tmp/workspace/imago" "$GITHUB_WORKSPACE/../imago"
      - run: bun install --cwd .tmp/workspace/imago --frozen-lockfile
      - run: bun run typecheck
      - run: bun run rustfmt
      - name: Run Rust checks with private Core access
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.KOSMOS_READ_TOKEN }}@github.com/makekosmos/core.git.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/makekosmos/core.git
        run: |
          bun run clippy
          bun run test:source-size
          bun run test:format
          bun run test:release-bom
          bun run test:package-contract
          bun test desktop/build/installer-shortcut.test.mjs
      - run: bun test host/electron/host-api-reconnect.test.ts

  windows-runtime:
    needs: plan
    if: needs.plan.outputs.full == 'true' || contains(needs.plan.outputs.jobs, 'windows-runtime')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - id: rustc
        shell: pwsh
        run: |
          $text = (rustc -Vv | Out-String) + (cargo -V | Out-String)
          $bytes = [Text.Encoding]::UTF8.GetBytes($text)
          $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          "version=$hash" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~\.cargo\git
            ~\.cargo\registry
          key: cargo-deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.rustc.outputs.version }}-
      # Compile output is an untrusted CI convenience cache, never a release artifact.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target
            desktop/.tmp/ark-core-rpc
          key: cargo-target-${{ runner.os }}-${{ runner.arch }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock', '.cargo/config.toml', 'desktop/scripts/ark-core-rpc.mjs') }}-debug-default+iroh-spike+package-worker-fixture
      - run: bun install --frozen-lockfile
      - run: bun install --cwd desktop --frozen-lockfile
      - name: Run Windows runtime checks with private Core access
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.KOSMOS_READ_TOKEN }}@github.com/makekosmos/core.git.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/makekosmos/core.git
        run: |
          cargo build --locked -p kepler-watcher -p kepler-focus-helper -p kepler-focus-svc --bins
          bun run test:rust
          cargo test --locked --package kepler-backend --test package_worker_windows --features package-worker-fixture
          cargo clippy --locked --package kepler-backend --all-targets --features package-worker-fixture -- -D warnings
          bun test desktop/electron/focus-enforcement.test.ts
          bun run --cwd desktop test:runtime-staging

  first-party-contracts:
    needs: plan
    if: needs.plan.outputs.full == 'true' || contains(needs.plan.outputs.jobs, 'first-party-contracts')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Resolve workspace pins
        id: workspace
        shell: pwsh
        run: node scripts/workspace.mjs ci --github-output $env:GITHUB_OUTPUT
      - name: Checkout first-party package revisions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: makekosmos/agenda
          ref: a0d5f5296f2cdc7930f7c575f65ede04eda37b12
          path: _first-party/agenda
          token: ${{ secrets.KOSMOS_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: makekosmos/arcadia
          ref: 1fcd46274bfd1c9dbfcf1dc40978b1c9e8d09520
          path: _first-party/arcadia
          fetch-depth: 0
          token: ${{ secrets.KOSMOS_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.workspace.outputs.imago_repository }}
          ref: ${{ steps.workspace.outputs.imago_commit }}
          path: .tmp/workspace/imago
          token: ${{ secrets.KOSMOS_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.workspace.outputs.arca_sdk_repository }}
          ref: ${{ steps.workspace.outputs.arca_sdk_commit }}
          path: .tmp/workspace/arca-sdk
          token: ${{ secrets.KOSMOS_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: makekosmos/daedalus
          ref: 7c1f40878276d2d6a81dc847efabc41ec8f757b2
          path: _first-party/daedalus
          token: ${{ secrets.KOSMOS_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: makekosmos/dictation
          ref: 57aae83d4bc80c5d0342a6b92072c59840d54dd4
          path: _first-party/dictation
          token: ${{ secrets.KOSMOS_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: makekosmos/memoria
          ref: 32cb4cafe3a8362a4d1539d0e75c6364797da914
          path: _first-party/memoria
          token: ${{ secrets.KOSMOS_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: makekosmos/ordo
          ref: 20790f6ba3f64a24e9ed5162d48f53e409b4e884
          path: _first-party/ordo
          token: ${{ secrets.KOSMOS_READ_TOKEN }}
          persist-credentials: false
      - name: Link first-party package workspaces
        shell: pwsh
        run: |
          $parent = Split-Path $env:GITHUB_WORKSPACE
          $links = @{ agenda = 'agenda'; arcadia = 'arcadia'; daedalus = 'daedalus'; dictation = 'dictation'; memoria = 'memoria'; focus = 'ordo' }
          foreach ($name in $links.Keys) {
            New-Item -ItemType Junction -Path (Join-Path $parent $name) -Target (Join-Path $env:GITHUB_WORKSPACE "_first-party/$($links[$name])") | Out-Null
          }
      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun install --cwd host --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch private Core before third-party package builds
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.KOSMOS_READ_TOKEN }}@github.com/makekosmos/core.git.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/makekosmos/core.git
        run: cargo fetch --locked
      - run: bun install --cwd .tmp/workspace/imago --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun install --cwd _first-party/arcadia --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun install --cwd _first-party/daedalus --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun install --cwd _first-party/ordo --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun run --cwd .tmp/workspace/imago build
      - name: Verify Imago package entrypoint
        shell: pwsh
        run: if (!(Test-Path .tmp/workspace/imago/dist/index.js)) { throw "Imago package entrypoint is missing" }
      - run: bun run --cwd _first-party/arcadia package:kspkg
      - run: bun run --cwd _first-party/daedalus package:kspkg
      - run: bun run --cwd _first-party/ordo package:kspkg
      - name: Run first-party package contracts
        env:
          CARGO_NET_OFFLINE: "true"
        run: bun run test:first-party-contracts

  cortex-quality-gate:
    if: always()
    needs: [plan, actionlint, portable, windows-runtime, first-party-contracts]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected job to pass
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SELECTED_JOBS: ${{ needs.plan.outputs.jobs }}
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
          PORTABLE_RESULT: ${{ needs.portable.result }}
          WINDOWS_RUNTIME_RESULT: ${{ needs.windows-runtime.result }}
          FIRST_PARTY_RESULT: ${{ needs.first-party-contracts.result }}
        run: |
          set -eu
          test "$PLAN_RESULT" = success
          case ",$SELECTED_JOBS," in *,actionlint,*) test "$ACTIONLINT_RESULT" = success;; esac
          case ",$SELECTED_JOBS," in *,portable,*) test "$PORTABLE_RESULT" = success;; esac
          case ",$SELECTED_JOBS," in *,windows-runtime,*) test "$WINDOWS_RUNTIME_RESULT" = success;; esac
          case ",$SELECTED_JOBS," in *,first-party-contracts,*) test "$FIRST_PARTY_RESULT" = success;; esac
