name: Shell checks

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: shell-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2

  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun run check:layout
      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun install --cwd desktop --frozen-lockfile
      - run: bun install --cwd host --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun install --cwd manager --frozen-lockfile
      - run: bun test desktop/electron/settings-store.test.ts
      - run: bun test desktop/electron/instance.test.ts
      - run: bun test desktop/scripts/desktop-naming-contract.test.mjs
      - run: bun run check:source-size
      - run: bun run lint
      - run: bun run format:check
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Checkout shared ARK SDK
        uses: actions/checkout@v4
        with:
          repository: makekosmos/arca-sdk
          path: _shared/arca-sdk
          fetch-depth: 1
          token: ${{ secrets.KOSMOS_READ_TOKEN }}
      - name: Checkout shared visuals
        uses: actions/checkout@v4
        with:
          repository: makekosmos/imago
          path: _shared/imago
          fetch-depth: 1
          token: ${{ secrets.KOSMOS_READ_TOKEN }}
      - name: Link shared workspaces
        run: |
          ln -s "$GITHUB_WORKSPACE/_shared/arca-sdk" "$GITHUB_WORKSPACE/../arca-sdk"
          ln -s "$GITHUB_WORKSPACE/_shared/imago" "$GITHUB_WORKSPACE/../imago"
      - run: bun run typecheck
      - run: bun run rustfmt
      - run: bun run clippy
      - run: bun run test
      - run: bun run test:rust
      - run: bun test host/electron/host-api-reconnect.test.ts

  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun install --cwd desktop --frozen-lockfile
      - run: cargo build --locked -p kepler-watcher -p kepler-focus-helper -p kepler-focus-svc --bins
      - run: cargo test --locked -p kepler-focus-helper -p kepler-focus-svc --lib
      - run: bun run --cwd desktop test:runtime-staging
