name: FatSecret fixture tests

on:
  pull_request:
    paths:
      - "integrations/fatsecret/**"
      - ".github/workflows/fatsecret.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fatsecret-fixtures-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check JavaScript syntax
        run: |
          node --check integrations/fatsecret/oauth1.mjs
          node --check integrations/fatsecret/mapping.mjs
          node --check integrations/fatsecret/provider.mjs
      - name: Run secret-free fixture tests
        run: node --test integrations/fatsecret/test/*.test.mjs
