name: Core dependency pin

on:
  pull_request:
    paths:
      - "runtime/Cargo.toml"
      - "desktop/scripts/ark-core-rpc.mjs"
      - "desktop/scripts/runtime-staging.test.mjs"
      - "Cargo.lock"
      - "scripts/check-core-pin.mjs"
      - ".github/workflows/core-pin.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-pin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-pin:
    name: core-pin
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate exact Core revision and layout
        run: node scripts/check-core-pin.mjs
      - name: Authenticate private Core dependency
        run: git config --global url."https://x-access-token:$GITHUB_TOKEN@github.com/".insteadOf "https://github.com/"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve workspace metadata
        run: cargo metadata --locked --format-version 1
      - name: Compile Cortex against pinned Core
        run: cargo check --locked --package kepler-backend
      - name: Run runtime staging contract test
        run: node --test desktop/scripts/runtime-staging.test.mjs
