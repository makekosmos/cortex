name: Core dependency pin

# KOS-76: hosted CI is disabled. `node scripts/check-core-pin.mjs` and the
# runtime staging test run locally; this workflow is manual dispatch only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-pin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-pin:
    name: core-pin
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Node.js 24.15.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
      - name: Use Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0
      - name: Validate exact Core revision and layout
        run: node scripts/check-core-pin.mjs
      - name: Resolve workspace metadata
        run: cargo metadata --locked --no-deps --format-version 1
      - name: Run runtime staging contract test
        run: node --test desktop/scripts/runtime-staging.test.mjs
