name: Nightly release

# 00:00 MSK (UTC+3) every night, plus manual dispatch. GitHub delays
# scheduled runs under load (observed lag up to ~6h), so we schedule for
# midnight MSK to let the Windows/macOS builds still finish before morning
# MSK (KOS-359). Ships the Windows installer and (independently) the macOS
# DMG to makekosmos/cortex releases; see desktop/scripts/release-plan.mjs for
# the skip/bump rules. The macOS job must not gate Windows publish (KOS-349).
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One release at a time: a manual dispatch queued behind the nightly run must
# not interleave pushes to main or double-publish.
concurrency:
  group: nightly-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # The plan runs before the smoke (KOS-322): the smoke must build and test
  # exactly the version the release will publish — or, when no release is
  # planned, the would-be next bugfix — never the stale release pin.
  plan:
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      build_version: ${{ steps.plan.outputs.build_version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Plan release
        id: plan
        shell: bash
        env:
          # Read-only on this repo's releases; the job token suffices.
          GH_TOKEN: ${{ github.token }}
        run: node desktop/scripts/release-plan.mjs plan

  # KOS-309: the installer must actually install before a release publishes —
  # 0.10.2 passed every script-text test and aborted on every real install.
  smoke:
    needs: plan
    uses: ./.github/workflows/installer-smoke.yml
    with:
      version: ${{ needs.plan.outputs.build_version }}
      # The smoke must test the exact commit the release builds: HEAD
      # normally, the already-tagged commit on a retry — never a main HEAD
      # that may have moved since the trigger.
      ref: ${{ needs.plan.outputs.sha }}

  release:
    needs: [plan, smoke]
    runs-on: windows-latest
    timeout-minutes: 300
    # Releases live in this repo (makekosmos/cortex) — the job's own
    # GITHUB_TOKEN pushes the release commit/tag and creates the GitHub
    # release. actions: read lets the CI gate below poll the CI run on
    # plan.sha. All other scopes stay at the default "none".
    permissions:
      contents: write
      actions: read
    steps:
      # Credentials persist (the default) so `git push` reuses the same
      # GITHUB_TOKEN — there are no PAT secrets anywhere in this workflow.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      # Releases are only cut from main — a dispatch on another ref must fail.
      - name: Validate release branch
        shell: bash
        run: test "$GITHUB_REF" = "refs/heads/main"

      # Toolchain pins live in toolchain.json — the BOM records them, so the
      # runner must build with exactly those versions.
      - name: Read toolchain pins
        shell: bash
        run: node -e 'const t=require("./toolchain.json");console.log("NODE_VERSION="+t.node+"\nRUST_VERSION="+t.rust)' >> "$GITHUB_ENV"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Bootstrap pnpm and install
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          # desktop/ is its own pnpm project (separate lockfile), not a
          # workspace member.
          pnpm --dir desktop install --frozen-lockfile

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-nextest

      # KOS-363: shared-key with installer-smoke's `build` job so this job
      # restores the cache the smoke just wrote on the same commit — the
      # release-profile dep tree is warm and `Build installer` only
      # rebuilds the env-stamped leaf crates. Cargo fingerprints still
      # validate every restored artifact.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: win-installer
          cache-on-failure: true
          workspaces: |
            . -> target
            core -> target
            manager-gpui -> target

      # The plan ran in the `plan` job before the smoke. Its sha is HEAD
      # normally, or the already-tagged commit when retrying a run that died
      # between tag push and publish — the release must be built from exactly
      # that commit.
      - name: Prepare release commit
        if: needs.plan.outputs.release == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          # The release preflight requires branch "main" checked out; the
          # checkout may be a detached HEAD.
          git checkout -B main "$RELEASE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node desktop/scripts/release-plan.mjs set "$VERSION"
          git add desktop/release-versions.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: release v$VERSION"
          fi
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            test "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)"
          else
            git tag "$tag"
          fi

      # The release commit normally only moves the version pin, and plan.sha
      # already passed the ci.yml `check` job — re-running every cargo
      # compile here (~28 min cold) then re-checks identical code. Detect
      # that case and downgrade to the cheap checks. Fail-closed: any file
      # other than desktop/release-versions.json, a dirty tree, or any doubt
      # keeps the full gate (KOS-364).
      - name: Classify release commit
        id: classify
        if: needs.plan.outputs.release == 'true'
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          pins_only=false
          changed="$(git diff --name-only "$RELEASE_SHA" HEAD)"
          dirty="$(git status --porcelain)"
          if [ -z "$dirty" ]; then
            case "$changed" in
              # Empty diff: retry on the already-tagged commit — nothing to
              # re-check. Single file: the only thing `release-plan set` +
              # the commit step above can ever touch.
              "" | "desktop/release-versions.json")
                pins_only=true ;;
            esac
          fi
          echo "pins_only=$pins_only" >> "$GITHUB_OUTPUT"
          echo "changed files vs $RELEASE_SHA:"
          printf '%s\n' "$changed"

      # Full gate on the release commit before anything is published.
      - name: Full gate
        if: needs.plan.outputs.release == 'true' && steps.classify.outputs.pins_only != 'true'
        run: pnpm run check

      # The pins_only path assumes plan.sha's code passed CI — verify that
      # assumption instead of trusting it: poll the ci.yml run on plan.sha,
      # wait while queued/in_progress, and fail on any other conclusion or on
      # a sha that never got a run. A retry builds the already-tagged release
      # commit, pushed by GITHUB_TOKEN, which triggers no CI run: gate on its
      # parent when that commit only bumps the pin.
      - name: CI passed on the planned sha
        if: needs.plan.outputs.release == 'true' && steps.classify.outputs.pins_only == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$(git diff --name-only "$RELEASE_SHA~1" "$RELEASE_SHA" 2>/dev/null)" = "desktop/release-versions.json" ]; then
            RELEASE_SHA="$(git rev-parse "$RELEASE_SHA~1")"
          fi
          deadline=$(( $(date +%s) + 60 * 60 ))
          grace=$(( $(date +%s) + 5 * 60 ))
          while :; do
            state="$(gh api "repos/$REPO/actions/runs?head_sha=$RELEASE_SHA&event=push" \
              --jq '[.workflow_runs[] | select(.name == "CI")] | .[0] // empty | .status + " " + (.conclusion // "")' \
              2>/dev/null || true)"
            case "$state" in
              "completed success")
                echo "CI on $RELEASE_SHA: success"
                exit 0 ;;
              "completed "*)
                echo "CI on $RELEASE_SHA concluded '${state#completed }' — refusing to release" >&2
                exit 1 ;;
              "")
                # No CI run yet — a fresh push's run may take a moment to
                # register; a sha that never got one fails after the grace.
                if [ "$(date +%s)" -ge "$grace" ]; then
                  echo "no CI run found for $RELEASE_SHA" >&2
                  exit 1
                fi ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "timed out waiting for CI on $RELEASE_SHA (state: ${state:-none})" >&2
              exit 1
            fi
            echo "waiting for CI on $RELEASE_SHA (state: ${state:-none})..."
            sleep 20
          done

      # Version-pin-only commit: plan.sha's code is unchanged since it passed
      # ci.yml `check`, so the cargo compile checks would rerun byte-identical
      # work. Always keep the cheap repo-wide lints plus the script tests that
      # actually cover release-versions.json and the staging layout. The
      # installer smoke and Build installer/publish below are never skipped.
      - name: Reduced gate (version-pin-only commit)
        if: needs.plan.outputs.release == 'true' && steps.classify.outputs.pins_only == 'true'
        run: |
          pnpm run check:fast
          pnpm run test:static
          node --test desktop/scripts/runtime-staging.test.mjs

      # Same recipe as `pnpm run build:installer:local`, minus --local:
      # Engine from this tree + Manager + NSIS installer + receipt.
      - name: Build installer
        if: needs.plan.outputs.release == 'true'
        run: pnpm --dir desktop run build

      - name: Publish dry run
        if: needs.plan.outputs.release == 'true'
        run: node desktop/scripts/publish-release.mjs --platform win --receipt desktop/release/release-receipt.v2.json --dry-run

      # Push the bump commit and tag only after the gate and build passed, so
      # a broken run never lands commits on main. Retry-safe: when a previous
      # run already pushed them (publish died afterwards), the release commit
      # is already part of origin/main and only a missing piece is pushed.
      - name: Push release commit and tag
        if: needs.plan.outputs.release == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          BASE_SHA: ${{ needs.plan.outputs.sha }}
          # The pins_only path ran no `pnpm run check`, so the lefthook
          # pre-push hook (installed by `pnpm install` → prepare) finds no
          # full-gate cache for this tree, replans the push diff —
          # release-versions.json is a full-influence file — and would rerun
          # the ~19 min gate here. Disable the hook only on that path; the
          # pushed tree is CI-verified plan.sha plus the generated pin.
          # LEFTHOOK=1 is lefthook's normal enabled state.
          LEFTHOOK: ${{ steps.classify.outputs.pins_only == 'true' && '0' || '1' }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          git fetch origin main
          remote_tag=$(git ls-remote origin "refs/tags/v$VERSION" | cut -f1)
          if [ -n "$remote_tag" ] && [ "$remote_tag" != "$head" ]; then
            echo "refs/tags/v$VERSION exists on origin pointing at $remote_tag — refusing" >&2
            exit 1
          fi
          refs=()
          if git merge-base --is-ancestor "$head" origin/main; then
            # Retry of a failed publish: the commit is on main already.
            :
          elif [ "$(git rev-parse origin/main)" = "$BASE_SHA" ]; then
            refs+=("HEAD:refs/heads/main")
          else
            echo "origin/main moved during the run — rerun" >&2
            exit 1
          fi
          [ -z "$remote_tag" ] && refs+=("refs/tags/v$VERSION")
          if [ ${#refs[@]} -gt 0 ]; then
            # The checkout's persisted GITHUB_TOKEN authenticates the push.
            git push --atomic origin "${refs[@]}"
          else
            echo "Release commit and tag already on origin — nothing to push"
          fi

      - name: Publish release
        if: needs.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node desktop/scripts/publish-release.mjs --platform win --receipt desktop/release/release-receipt.v2.json

      - name: Verify release channel
        if: needs.plan.outputs.release == 'true'
        run: pnpm --dir desktop run verify:channel

  # KOS-349: macOS DMG build. Depends on plan only — never on the Windows
  # smoke or release jobs — so a red Mac step cannot block the Windows
  # installer. The macOS runner builds the DMG and hands desktop/release/* to
  # `publish-mac` (a cheap Linux runner that starts only after `release`
  # lands), so the Mac stops billing while Windows finishes.
  release-mac:
    needs: [plan]
    if: needs.plan.outputs.release == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      - name: Read toolchain pins
        shell: bash
        run: node -e 'const t=require("./toolchain.json");console.log("NODE_VERSION="+t.node+"\nRUST_VERSION="+t.rust)' >> "$GITHUB_ENV"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Bootstrap pnpm and install
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"

      - name: macOS Metal compiler
        run: |
          if ! xcrun --find metal; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      # The build can legitimately end on failure/cancel; without
      # cache-on-failure the built target dirs are discarded and the next
      # nightly rebuilds ~15 min from cold.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            core -> target
            manager-gpui -> target

      # Align pins with the planned release version without pushing — Win owns
      # the bump commit + tag on main. Checkout may be detached at plan.sha.
      - name: Set release version (local)
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node desktop/scripts/release-plan.mjs set "$VERSION"
          node desktop/scripts/release-plan.mjs set --platform mac "$VERSION"

      # TODO(KOS-349): export Apple Developer ID / notary secrets here when
      # available and switch package-macos-dmg.mjs to a signed+notarized path.
      # Unsigned DMG is the publishable artifact until then.
      - name: Build macOS native binaries + DMG
        run: |
          pnpm --dir desktop run build:native:macos
          # --skip-preflight: pin was set locally on a detached plan.sha (dirty
          # tree); still emit manifest.json + receipt for the publish handoff.
          node desktop/scripts/build-desktop.mjs --platform mac --skip-preflight

      # Everything the mac publish step reads lives under desktop/release
      # (DMG, manifest.json, latest-mac.yml, the receipt); publish-mac on
      # ubuntu-latest downloads it there.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-mac
          path: desktop/release/
          retention-days: 1

  # Mac publish. needs: release is the ordering guarantee the old
  # release-mac in-job "Wait for cortex release" poll provided (KOS-349
  # lesson, v0.10.7 run 37540994541): the job only starts once Windows has
  # created the release and its manifest.json, so the mac publish can merge
  # platforms.mac into it without racing refs/tags/vX (+ latest-mac.yml while
  # dual-publish is on, KOS-350). A red release-mac still never blocks the
  # Windows job — this job only follows it.
  publish-mac:
    needs: [plan, release, release-mac]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # gh release upload attaches the DMG and the merged manifest.json.
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      - name: Read toolchain pins
        shell: bash
        run: node -e 'const t=require("./toolchain.json");console.log("NODE_VERSION="+t.node)' >> "$GITHUB_ENV"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Bootstrap pnpm and install
        shell: bash
        run: |
          corepack enable
          pnpm --dir desktop install --frozen-lockfile

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-mac
          path: desktop/release

      # publish-release.mjs verifies the receipt against HEAD + the local
      # version pin — replay the same local pin release-mac built with.
      - name: Set release version (local)
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node desktop/scripts/release-plan.mjs set "$VERSION"
          node desktop/scripts/release-plan.mjs set --platform mac "$VERSION"

      - name: Publish dry run
        env:
          MUNDUS_RELEASE_LOCAL: "1"
        run: node desktop/scripts/publish-release.mjs --platform mac --receipt desktop/release/release-receipt.v2.json --dry-run

      - name: Publish macOS assets
        env:
          GH_TOKEN: ${{ github.token }}
          MUNDUS_RELEASE_LOCAL: "1"
        run: node desktop/scripts/publish-release.mjs --platform mac --receipt desktop/release/release-receipt.v2.json

      - name: Verify mac channel
        run: pnpm --dir desktop run verify:channel -- --platform mac
