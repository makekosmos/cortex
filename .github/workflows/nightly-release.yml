name: Nightly release

# 06:00 MSK (UTC+3) every night, plus manual dispatch. Ships the Windows
# installer through the same scripts a manual release uses; see
# desktop/scripts/release-plan.mjs for the skip/bump rules.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One release at a time: a manual dispatch queued behind the nightly run must
# not interleave pushes to main or double-publish.
concurrency:
  group: nightly-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # Releases are only cut from main — a dispatch on another ref must fail.
      - name: Validate release branch
        shell: bash
        run: test "$GITHUB_REF" = "refs/heads/main"

      # Toolchain pins live in toolchain.json — the BOM records them, so the
      # runner must build with exactly those versions.
      - name: Read toolchain pins
        shell: bash
        run: node -p 'const t = require("./toolchain.json"); `NODE_VERSION=${t.node}\nRUST_VERSION=${t.rust}`' >> "$GITHUB_ENV"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Bootstrap pnpm and install
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          # desktop/ is its own pnpm project (separate lockfile), not a
          # workspace member.
          pnpm --dir desktop install --frozen-lockfile

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-nextest

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            core -> target
            manager-gpui -> target

      - name: Plan release
        id: plan
        shell: bash
        env:
          # Read-only on makekosmos/desktop releases; falls back to anonymous
          # rate limits if unset.
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN }}
        run: node desktop/scripts/release-plan.mjs plan

      - name: Apply version bump and tag
        if: steps.plan.outputs.release == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          node desktop/scripts/release-plan.mjs set "$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/release-versions.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: release v$VERSION"
          fi
          # The release preflight requires branch "main" checked out; the
          # checkout may be a detached HEAD.
          git checkout -B main
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            test "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)"
          else
            git tag "$tag"
          fi

      # Full gate on the release commit before anything is published.
      - name: Full gate
        if: steps.plan.outputs.release == 'true'
        run: pnpm run check

      # Same recipe as `pnpm run build:installer:local`, minus --local:
      # Engine from this tree + Manager + NSIS installer + receipt.
      - name: Build installer
        if: steps.plan.outputs.release == 'true'
        run: pnpm --dir desktop run build

      - name: Publish dry run
        if: steps.plan.outputs.release == 'true'
        run: node desktop/scripts/publish-release.mjs --platform win --receipt desktop/release/release-receipt.v2.json --dry-run

      # Push the bump commit and tag only after the gate and build passed, so
      # a broken run never lands commits on main. Retry-safe: if a previous
      # run already pushed (publish failed afterwards), the push is a no-op.
      - name: Push release commit and tag
        if: steps.plan.outputs.release == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          PLAN_SHA: ${{ steps.plan.outputs.sha }}
          PUSH_TOKEN: ${{ secrets.CORTEX_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          git fetch origin main
          remote_main=$(git rev-parse origin/main)
          remote_tag=$(git ls-remote origin "refs/tags/v$VERSION" | cut -f1)
          if [ -n "$remote_tag" ] && [ "$remote_tag" != "$head" ]; then
            echo "refs/tags/v$VERSION exists on origin pointing at $remote_tag — refusing" >&2
            exit 1
          fi
          if [ "$remote_main" != "$head" ] && [ "$remote_main" != "$PLAN_SHA" ]; then
            echo "origin/main moved to $remote_main during the run — rerun" >&2
            exit 1
          fi
          # Token via credential helper — never in the remote URL, so git
          # error output can never echo it.
          git config credential.helper '!f() { echo username=x-access-token; echo "password=$PUSH_TOKEN"; }; f'
          git push --atomic origin "HEAD:refs/heads/main" "refs/tags/v$VERSION"

      - name: Publish release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN }}
        run: node desktop/scripts/publish-release.mjs --platform win --receipt desktop/release/release-receipt.v2.json

      - name: Verify release channel
        if: steps.plan.outputs.release == 'true'
        run: pnpm --dir desktop run verify:channel
