# Scoped suppressions for the new CI lint leg (KOS-324).
#
# nightly-release.yml and installer-smoke.yml predate actionlint and both read
# toolchain pins via a single-quoted `node -p` string containing `${t.node}` —
# shellcheck SC2016 (info). The real fix is switching them to concatenation
# like ci.yml uses; they are out of scope for this ticket, so the suppression
# is pinned to exactly those files and exactly that rule. Any other shellcheck
# finding in them — and anything at all in other workflows — still fails.
paths:
  .github/workflows/nightly-release.yml:
    ignore:
      - "shellcheck reported issue in this script: SC2016"
  .github/workflows/installer-smoke.yml:
    ignore:
      - "shellcheck reported issue in this script: SC2016"
